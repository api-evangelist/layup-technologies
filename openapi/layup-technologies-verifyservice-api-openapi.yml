openapi: 3.2.0
info:
  title: Layup endpoints Verify Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: VerifyService
paths:
  /v1/verify:
    get:
      operationId: VerifyService_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelVerifyResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: token
        in: query
        required: false
        schema:
          type: string
      - name: msisdn
        in: query
        required: false
        schema:
          type: string
      tags:
      - VerifyService
      summary: Verify service get
      x-summary-source: derived
components:
  schemas:
    modelVerifyResponse:
      type: object
      properties:
        userId:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
