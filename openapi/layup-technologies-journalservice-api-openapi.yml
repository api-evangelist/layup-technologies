openapi: 3.2.0
info:
  title: Layup endpoints Journal Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: JournalService
paths:
  /v1/journals:
    post:
      operationId: JournalService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelJournalResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: query
        required: false
        schema:
          type: string
      tags:
      - JournalService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelJournalRequest'
        required: true
      summary: Journal service create
      x-summary-source: derived
components:
  schemas:
    modelJournalRequest:
      type: object
      properties:
        orderId:
          type: string
        participantId:
          type: string
        note:
          type: string
        amount:
          type: integer
          format: int32
    modelJournalResponse:
      type: object
      properties:
        _id:
          type: string
        orderId:
          type: string
        participantId:
          type: string
        note:
          type: string
        amount:
          type: integer
          format: int32
        amountExcludingFee:
          type: integer
          format: int32
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
