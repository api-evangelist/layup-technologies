openapi: 3.2.0
info:
  title: Layup endpoints Absa Eft Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: AbsaEftService
paths:
  /v1/absa/eft/output:
    post:
      operationId: AbsaEftService_output
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelAbsaEftResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      tags:
      - AbsaEftService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelAbsaEftOutputRequest'
        required: true
      summary: Absa eft service output
      x-summary-source: derived
  /v1/absa/eft/reply:
    post:
      operationId: AbsaEftService_reply
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelAbsaEftResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      tags:
      - AbsaEftService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelAbsaEftReplyRequest'
        required: true
      summary: Absa eft service reply
      x-summary-source: derived
components:
  schemas:
    modelAbsaEftResponse:
      type: object
    modelAbsaEftOutputRequest:
      type: object
      properties:
        transmissionNumber:
          type: integer
          format: int32
        fileStoragePath:
          type: string
        rejectedTransactions:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/modelRejectedTransaction'
    modelAbsaEftReplyRequest:
      type: object
      properties:
        ldCode:
          type: string
        transmissionNumber:
          type: integer
          format: int32
        transmissionStatus:
          type: string
        fileStoragePath:
          type: string
    modelRejectedTransaction:
      type: object
      properties:
        transmissionDate:
          type: string
        originalSequenceNumber:
          type: integer
          format: int32
        amount:
          type: integer
          format: int32
        userReference:
          type: string
        rejectionReason:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
