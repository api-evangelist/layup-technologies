openapi: 3.2.0
info:
  title: Layup endpoints Card Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: CardService
paths:
  /v1/cards:
    get:
      operationId: CardService_GetMany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelCardResponseMany'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      tags:
      - CardService
      summary: Card service get many
      x-summary-source: derived
    post:
      operationId: CardService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelCardResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: query
        required: false
        schema:
          type: string
      tags:
      - CardService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelCardRequest'
        required: true
      summary: Card service create
      x-summary-source: derived
  /v1/cards/{_id}:
    get:
      operationId: CardService_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelCardResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CardService
      summary: Card service get
      x-summary-source: derived
    delete:
      operationId: CardService_Remove
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CardService
      summary: Card service remove
      x-summary-source: derived
    put:
      operationId: CardService_Update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelCardResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: path
        required: true
        schema:
          type: string
      tags:
      - CardService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelCardRequest'
        required: true
      summary: Card service update
      x-summary-source: derived
components:
  schemas:
    modelCardResponse:
      type: object
      properties:
        _id:
          type: string
        userId:
          type: string
        nameOnCard:
          type: string
        cardType:
          type: string
        cardDigits:
          type: string
        defaultCard:
          type: boolean
        expiryMonth:
          type: string
        expiryYear:
          type: string
        timestamp:
          type: number
          format: double
        checkoutId:
          type: string
        resourcePath:
          type: string
        merchantId:
          type: string
    modelCardResponseMany:
      type: object
      properties:
        clientCards:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/modelCardResponse'
    modelCardRequest:
      type: object
      properties:
        userId:
          type: string
        defaultCard:
          type: boolean
        redirectUrl:
          type: string
      title: card
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
