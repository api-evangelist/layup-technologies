openapi: 3.2.0
info:
  title: Layup endpoints Token Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: TokenService
paths:
  /v1/tokens:
    post:
      operationId: TokenService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: query
        required: false
        schema:
          type: string
      tags:
      - TokenService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelTokenRequest'
        required: true
      summary: Token service create
      x-summary-source: derived
components:
  schemas:
    modelTokenRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - VERIFYACCOUNT
          - CREATEPAYMENTPLAN
          - VIEWPAYMENTPLAN
          - VERIFYACCOUNTCREATEPAYMENTPLAN
        cellNumber:
          type: string
        reference:
          type: string
        email:
          type: string
        _id:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
