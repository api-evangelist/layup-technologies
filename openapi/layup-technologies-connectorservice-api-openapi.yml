openapi: 3.2.0
info:
  title: Layup endpoints Connector Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: ConnectorService
paths:
  /v1/connectors/{paymentProviderPaymentId}:
    put:
      operationId: ConnectorService_Update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelConnectorResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: paymentProviderPaymentId
        in: path
        required: true
        schema:
          type: string
      tags:
      - ConnectorService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelConnectorRequest'
        required: true
      summary: Connector service update
      x-summary-source: derived
components:
  schemas:
    modelConnectorResponse:
      type: object
      properties:
        _id:
          type: string
        paymentMethod:
          type: string
        paymentProvider:
          type: string
        amount:
          type: integer
          format: int32
        paymentProviderPaymentId:
          type: string
        paymentReference:
          type: string
    modelConnector:
      type: object
      properties:
        _id:
          type: string
        paymentMethod:
          type: string
        paymentProvider:
          type: string
    modelConnectorRequest:
      type: object
      properties:
        paymentProviderPaymentId:
          type: string
        connector:
          $ref: '#/components/schemas/modelConnector'
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
