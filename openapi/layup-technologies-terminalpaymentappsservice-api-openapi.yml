openapi: 3.2.0
info:
  title: Layup endpoints Terminal Payment Apps Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: TerminalPaymentAppsService
paths:
  /v1/terminalPaymentApps:
    get:
      operationId: TerminalPaymentAppsService_getMany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelTerminalPaymentAppsGetManyResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      tags:
      - TerminalPaymentAppsService
      summary: Terminal payment apps service get many
      x-summary-source: derived
components:
  schemas:
    modelTerminalPaymentAppResponse:
      type: object
      properties:
        _id:
          type: string
        merchantId:
          type: string
        packageName:
          type: string
        paymentMethod:
          type: string
        provider:
          type: string
    modelTerminalPaymentAppsGetManyResponse:
      type: object
      properties:
        terminalPaymentApps:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/modelTerminalPaymentAppResponse'
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
