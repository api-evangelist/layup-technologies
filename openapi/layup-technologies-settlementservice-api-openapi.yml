openapi: 3.2.0
info:
  title: Layup endpoints Settlement Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: SettlementService
paths:
  /v2/settlements:
    post:
      operationId: SettlementService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelSettlementResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: query
        required: false
        schema:
          type: string
      - name: taskToken
        in: query
        required: false
        schema:
          type: string
      tags:
      - SettlementService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelSettlementRequest'
        required: true
      summary: Settlement service create
      x-summary-source: derived
  /v2/settlements-report:
    get:
      operationId: SettlementService_GetReport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelSettlementReportResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: fromDate
        in: query
        required: false
        schema:
          type: string
      - name: toDate
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      tags:
      - SettlementService
      summary: Settlement service get report
      x-summary-source: derived
  /v3/settlement-reports/{merchantId}/{settlementReferenceWithExtension}:
    get:
      summary: Redirect to pre-signed URL
      operationId: SettlementService_DownloadReport
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelSettlementDownloadResponse'
        '204':
          description: Successfully processed the request, no content.
        '302':
          description: Redirect to the pre-signed S3 URL
          headers:
            Location:
              description: The pre-signed S3 URL
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema: {}
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
      - name: settlementReferenceWithExtension
        description: reference.zip
        in: path
        required: true
        schema:
          type: string
      tags:
      - SettlementService
components:
  schemas:
    modelSettlementDownloadResponse:
      type: object
      properties:
        url:
          type: string
          title: The location that the user will be redirected to
    modelSettlementResponse:
      type: object
      properties:
        _id:
          type: string
        amount:
          type: number
          format: double
        fee:
          type: number
          format: double
        batch:
          type: string
        merchantId:
          type: string
        merchantAccountId:
          type: string
        reference:
          type: string
        dateSettled:
          type: string
        reconciled:
          type: boolean
        settled:
          type: boolean
        paymentIds:
          type: array
          items:
            type: string
        journalFees:
          type: array
          items:
            type: string
        batchType:
          type: string
        absaEftFile:
          type: string
        bankTransactionId:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        draft:
          type: boolean
    modelSettlementRequest:
      type: object
      properties:
        merchantId:
          type: string
        to:
          type: string
        from:
          type: string
        batchType:
          type: string
        automatic:
          type: boolean
        negative:
          type: boolean
        preview:
          type: boolean
    modelSettlementReportResponse:
      type: object
      properties:
        settlements:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/modelSettlementReport'
    modelSettlementReport:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
          format: double
        batch:
          type: number
          format: double
        batchType:
          type: string
        merchantId:
          type: string
        status:
          type: string
        reference:
          type: string
        settledAt:
          type: string
        reconciled:
          type: boolean
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
