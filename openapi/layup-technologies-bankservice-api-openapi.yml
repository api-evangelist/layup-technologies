openapi: 3.2.0
info:
  title: Layup endpoints Bank Service API
  version: 1.4.16
  description: Welcome to The Layup Swagger page.
servers:
- url: http://localhost:3000
- url: https://localhost:3000
- url: wss://localhost:3000
security:
- apiKey:
  - read
  - write
tags:
- name: BankService
paths:
  /v1/banks:
    get:
      operationId: BankService_getMany
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelBankGetManyResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      tags:
      - BankService
      summary: Bank service get many
      x-summary-source: derived
    post:
      operationId: BankService_create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelBankResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      tags:
      - BankService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelBankCreateRequest'
        required: true
      summary: Bank service create
      x-summary-source: derived
  /v1/banks/{_id}:
    delete:
      operationId: BankService_delete
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelBankResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: path
        required: true
        schema:
          type: string
      tags:
      - BankService
      summary: Bank service delete
      x-summary-source: derived
    put:
      operationId: BankService_update
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modelBankResponse'
        '204':
          description: Successfully processed the request, no content.
        '403':
          description: Returned when the user does not have permission to access the resource.
        '404':
          description: Returned when the resource does not exist.
      parameters:
      - name: _id
        in: path
        required: true
        schema:
          type: string
      tags:
      - BankService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modelBankUpdateRequest'
        required: true
      summary: Bank service update
      x-summary-source: derived
components:
  schemas:
    modelBankCreateRequest:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        shortName:
          type: string
        branchCode:
          type: string
        avsInstitutionCode:
          type: string
    modelBankResponse:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        displayName:
          type: string
        shortName:
          type: string
        branchCode:
          type: string
        avsInstitutionCode:
          type: string
    modelBankGetManyResponse:
      type: object
      properties:
        banks:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/modelBankResponse'
    modelBankUpdateRequest:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        shortName:
          type: string
        branchCode:
          type: string
        avsInstitutionCode:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: header
