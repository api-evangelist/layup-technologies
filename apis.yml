aid: layup-technologies
name: LayUp Technologies
description: >-
  LayUp Technologies is a South African fintech that operates a lay-by / "Save
  Now, Buy Later" payment platform. Merchants use LayUp to let customers reserve
  goods with a deposit and pay the balance off in scheduled instalments (weekly
  or monthly) before taking delivery, avoiding credit and interest. The platform
  schedules payments, holds inventory, and settles merchants once orders
  complete. LayUp exposes a REST API (apikey header auth) covering merchants,
  orders, order amendments, payment plans, payments, cards, DebiCheck and debit
  order mandates, EFT, PayAt, invoices, settlements, and integrations for
  platforms such as Shopify, plus order and payment webhooks. It ships a
  first-party PHP SDK and a WooCommerce payment gateway plugin, and is a
  Techstars-backed company.
url: https://raw.githubusercontent.com/api-evangelist/layup-technologies/refs/heads/main/apis.yml
